name: manarat_al_indibat
description: "منارة الانضباط — Personal Behavioral Operating System (PBOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (MVVM)
  provider: ^6.1.2

  # Dependency Injection
  get_it: ^7.7.0

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Notifications & background work
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.5.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  # flutter_background_service: ^5.0.10
  # ^ Not enabled by default — Workmanager (WorkManager on Android,
  # BGTaskScheduler on iOS) already covers this app's periodic
  # analysis + notification-delivery use case. Uncomment only if you
  # later need a persistent Android foreground service (e.g. a
  # live "focus session" notification that must never be killed by
  # Doze); it has no iOS equivalent, so it would be Android-only.

  # Charts for statistics dashboard
  fl_chart: ^0.68.0

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5

  # Functional error handling
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#12072B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  generate: false
  # Cairo (Arabic-first typeface) is loaded at runtime via google_fonts,
  # so no local font assets are required. If you prefer fully offline fonts,
  # download Cairo from fonts.google.com, drop the .ttf files into
  # assets/fonts/, and declare them here instead.
